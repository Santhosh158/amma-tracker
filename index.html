<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0d1f12"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Amma Tracker 🌿</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overscroll-behavior:none}#err{display:none;padding:40px;font-family:sans-serif;text-align:center}</style>
</head>
<body>
<div id="root"></div>
<div id="err"></div>
<script>
window.onerror=function(m,s,l){
  document.getElementById('err').style.display='block';
  document.getElementById('err').innerHTML='<h2 style="color:#dc2626">⚠️ Error</h2><p>'+m+'</p><p style="font-size:11px;color:#999">Line '+l+'</p><button onclick="location.reload()" style="padding:12px 24px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:16px;margin-top:12px">Reload</button>';
};
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
try{
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
}catch(e){
  document.getElementById('err').style.display='block';
  document.getElementById('err').innerHTML='<h2 style="color:#dc2626">⚠️ App Error</h2><p style="color:#666">'+e.message+'</p><pre style="text-align:left;background:#f5f5f5;padding:12px;border-radius:8px;overflow:auto;font-size:11px;max-height:200px">'+e.stack+'</pre><button onclick="location.reload()" style="padding:12px 24px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:16px;margin-top:12px">Reload</button>';
}
</script>
</body>
</html>
