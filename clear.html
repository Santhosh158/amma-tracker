<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Amma — Cache Fix</title>
<style>
body{font-family:-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f0fdf4;margin:0;padding:20px}
.box{background:#fff;border-radius:20px;padding:40px 30px;text-align:center;max-width:340px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
h2{color:#166534;margin-bottom:12px}
p{color:#6b7280;font-size:14px;line-height:1.6;margin-bottom:20px}
button{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;padding:14px 32px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.ok{color:#16a34a;font-size:15px;font-weight:600;margin-top:16px}
</style>
</head>
<body>
<div class="box">
<h2>🌿 Amma Tracker Fix</h2>
<p>Clear old cache and load latest version.</p>
<button onclick="fixIt()">Fix & Reload 🔄</button>
<div id="ok"></div>
</div>
<script>
async function fixIt(){
  var btn=document.querySelector('button');
  var ok=document.getElementById('ok');
  btn.textContent='Fixing...';
  btn.disabled=true;
  ok.textContent='🔄 Clearing caches...';
  try{
    // 1. Unregister all service workers
    if(navigator.serviceWorker){
      var regs=await navigator.serviceWorker.getRegistrations();
      for(var i=0;i<regs.length;i++) await regs[i].unregister();
    }
    // 2. Delete all caches
    if(window.caches){
      var keys=await caches.keys();
      for(var j=0;j<keys.length;j++) await caches.delete(keys[j]);
    }
    ok.textContent='✅ Cache cleared! Loading fresh...';
    // 3. Force reload with cache bypass
    setTimeout(function(){
      window.location.href='./index.html?nocache='+Date.now();
    },1000);
  }catch(e){
    ok.innerHTML='⚠️ '+e.message+'<br><br>Try: Settings → Safari → Clear Website Data for this site';
  }
}
</script>
</body>
</html>
